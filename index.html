<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Najah Nephrology Research Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0a1628;
    --teal: #00c2b3;
    --teal-soft: #00e5d4;
    --lavender: #a78bfa;
    --white: #f0f6ff;
    --muted: #8fafc8;
    --card: rgba(255,255,255,0.04);
    --border: rgba(0,194,179,0.18);
  }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(0,194,179,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 90% 80%, rgba(167,139,250,0.06) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px 80px;
    position: relative; z-index: 1;
  }

  /* HEADER */
  header {
    padding: 52px 0 40px;
    text-align: center;
  }

  .kidney-wrap {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .kidney {
    width: 52px; height: 38px;
    background: linear-gradient(135deg, var(--teal), var(--lavender));
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transform: rotate(-20deg);
    box-shadow: 0 0 40px rgba(0,194,179,0.35);
    animation: pulse-glow 3s ease-in-out infinite;
  }

  .kidney.right {
    transform: rotate(20deg) scaleX(-1);
    animation-delay: -1.5s;
  }

  @keyframes pulse-glow {
    0%,100% { box-shadow: 0 0 25px rgba(0,194,179,0.3); }
    50% { box-shadow: 0 0 55px rgba(0,194,179,0.55); }
  }

  .nnuh-tag {
    display: inline-block;
    font-family: 'Syne', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--teal);
    border: 1px solid rgba(0,194,179,0.35);
    padding: 4px 14px;
    border-radius: 100px;
    margin-bottom: 14px;
    background: rgba(0,194,179,0.07);
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 0%, var(--teal-soft) 50%, var(--lavender) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 14px;
    line-height: 1.15;
  }

  .welcome-box {
    max-width: 580px;
    margin: 0 auto;
    background: rgba(0,194,179,0.06);
    border: 1px solid rgba(0,194,179,0.15);
    border-radius: 14px;
    padding: 16px 22px;
    color: #a8c8e0;
    font-size: 0.92rem;
    line-height: 1.65;
    font-weight: 300;
  }

  /* FILTER BAR */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 32px 0 26px;
  }

  .filter-btn {
    padding: 7px 18px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.22s ease;
    backdrop-filter: blur(8px);
  }

  .filter-btn:hover { border-color: var(--teal); color: var(--teal); }

  .filter-btn.active {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--navy);
    font-weight: 700;
  }

  /* ADD FORM */
  .add-form {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px 26px 22px;
    margin-bottom: 38px;
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
  }

  .add-form::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--teal), var(--lavender));
  }

  .add-form h2 {
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--teal-soft);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-row.full  { grid-template-columns: 1fr; }

  .field label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0,194,179,0.2);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus { border-color: var(--teal); }

  .field input::placeholder,
  .field textarea::placeholder { color: #4a6a85; }

  .field select option { background: #0d1f3c; }

  .form-bottom {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .submit-btn {
    padding: 12px 32px;
    border-radius: 100px;
    border: none;
    background: linear-gradient(135deg, var(--teal), var(--lavender));
    color: var(--navy);
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .submit-btn:hover { transform: scale(1.04); opacity: 0.9; }
  .submit-btn:active { transform: scale(0.97); }

  #formMsg {
    font-size: 0.82rem;
    color: var(--teal-soft);
    min-height: 18px;
    margin-top: 6px;
  }

  /* IDEAS HEADER */
  .ideas-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .ideas-header h3 {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--muted);
  }

  .ideas-header h3 span {
    color: var(--teal-soft);
    font-size: 1.2rem;
  }

  .search-wrap { position: relative; }

  .search-wrap input {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 16px 8px 36px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.83rem;
    outline: none;
    width: 220px;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--teal); }
  .search-wrap input::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.85rem;
    pointer-events: none;
  }

  /* CARDS */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }

  .idea-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    cursor: pointer;
    transition: all 0.28s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    animation: card-in 0.4s ease both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .idea-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent, var(--teal)), transparent);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .idea-card:hover {
    transform: translateY(-3px) scale(1.01);
    border-color: var(--accent, var(--teal));
    box-shadow: 0 16px 48px rgba(0,0,0,0.25);
  }

  .idea-card:hover::before { opacity: 1; }

  .idea-card.expanded {
    grid-column: 1 / -1;
    border-color: var(--accent, var(--teal));
    background: rgba(255,255,255,0.06);
    cursor: default;
  }

  .card-cat {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.9;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.97rem;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 6px;
    color: var(--white);
  }

  .card-type {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  /* expanded detail rows */
  .card-detail {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.07);
    animation: card-in 0.3s ease;
  }

  .idea-card.expanded .card-detail { display: block; }

  .detail-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 0.84rem;
    line-height: 1.55;
  }

  .detail-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    padding-top: 2px;
    min-width: 70px;
  }

  .detail-val { color: #c0daf0; }

  /* assigned pill */
  .assigned-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(167,139,250,0.12);
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: 100px;
    padding: 3px 10px 3px 7px;
    font-size: 0.78rem;
    color: #c4b5fd;
    font-weight: 500;
  }

  .assigned-avatar {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal), var(--lavender));
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem;
    font-weight: 800;
    color: var(--navy);
    flex-shrink: 0;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card-time {
    font-size: 0.72rem;
    color: #4a6a85;
  }

  .toggle-hint {
    font-size: 0.75rem;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .idea-card:hover .toggle-hint { opacity: 1; }

  /* EMPTY / LOADING */
  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
  }

  .empty-hex {
    width: 80px; height: 88px;
    background: rgba(0,194,179,0.08);
    clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 2rem;
  }

  .empty-state p { font-size: 0.95rem; max-width: 300px; margin: 0 auto; line-height: 1.6; }

  .loading {
    text-align: center; padding: 40px;
    color: var(--muted); font-size: 0.9rem; letter-spacing: 0.05em;
  }

  @media (max-width: 640px) {
    .form-row, .form-row.three { grid-template-columns: 1fr; }
    .cards-grid { grid-template-columns: 1fr; }
    .ideas-header { flex-direction: column; align-items: flex-start; }
    .search-wrap input { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <header>
    <div class="kidney-wrap">
      <div class="kidney"></div>
      <div class="kidney right"></div>
    </div>
    <div class="nnuh-tag">Najah National University Hospital</div>
    <h1>Najah Nephrology<br>Research Hub</h1>
    <div class="welcome-box">
      Welcome! This shared space is to collaborate on new research ideas. If you have a concept, please add it to the appropriate thematic table below.
    </div>
  </header>

  <!-- FILTER -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="aki">AKI &amp; Critical Care</button>
    <button class="filter-btn" data-filter="ckd">CKD &amp; Progression</button>
    <button class="filter-btn" data-filter="transplant">Transplant</button>
    <button class="filter-btn" data-filter="glomerular">Glomerular</button>
    <button class="filter-btn" data-filter="dialysis">Dialysis</button>
    <button class="filter-btn" data-filter="onco">Onco-Nephrology</button>
  </div>

  <!-- ADD FORM -->
  <div class="add-form">
    <h2>✦ Add a Research Idea</h2>

    <div class="form-row three">
      <div class="field">
        <label>Your Name</label>
        <input type="text" id="inName" placeholder="e.g. Dr. Ahmed">
      </div>
      <div class="field">
        <label>Assigned To</label>
        <input type="text" id="inAssigned" placeholder="e.g. Dr. Patel, Dr. Lee…">
      </div>
      <div class="field">
        <label>Category</label>
        <select id="inCat">
          <option value="aki">AKI &amp; Critical Care</option>
          <option value="ckd">CKD &amp; Progression</option>
          <option value="transplant">Transplant</option>
          <option value="glomerular">Glomerular Disease</option>
          <option value="dialysis">Dialysis &amp; ESRD</option>
          <option value="onco">Onco-Nephrology</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label>Research Question / Title</label>
        <input type="text" id="inTitle" placeholder="e.g. Role of SGLT2i in AKI prevention in ICU patients…">
      </div>
      <div class="field">
        <label>Study Type</label>
        <input type="text" id="inType" placeholder="e.g. RCT, Cohort, Meta-analysis…">
      </div>
    </div>

    <div class="form-row full">
      <div class="field">
        <label>Brief Description &amp; Methods <span style="font-weight:300;text-transform:none;letter-spacing:0;">(optional)</span></label>
        <textarea id="inDesc" rows="2" placeholder="Study design, population, outcomes, methods…"></textarea>
      </div>
    </div>

    <div class="form-bottom">
      <button class="submit-btn" id="submitBtn">Add Idea →</button>
      <div id="formMsg"></div>
    </div>
  </div>

  <!-- IDEAS LIST -->
  <div class="ideas-header">
    <h3><span id="countEl">0</span> ideas shared</h3>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search ideas…">
    </div>
  </div>

  <div id="cardContainer"><div class="loading">Loading ideas…</div></div>

</div>

<script>
const CATS = {
  aki:        { label: 'AKI & Critical Care',  emoji: '⚡', color: '#38bdf8' },
  ckd:        { label: 'CKD & Progression',     emoji: '📈', color: '#00c2b3' },
  transplant: { label: 'Transplant',            emoji: '🫀', color: '#ff6b6b' },
  glomerular: { label: 'Glomerular Disease',    emoji: '🔬', color: '#a78bfa' },
  dialysis:   { label: 'Dialysis & ESRD',       emoji: '💧', color: '#ffbe3d' },
  onco:       { label: 'Onco-Nephrology',       emoji: '🧬', color: '#34d399' },
};

let ideas = [];
let activeFilter = 'all';

async function loadIdeas() {
  try {
    const result = await window.storage.get('nnuh-nephro-ideas', true);
    ideas = result ? JSON.parse(result.value) : [];
  } catch { ideas = []; }
  render();
}

async function saveIdeas() {
  try {
    await window.storage.set('nnuh-nephro-ideas', JSON.stringify(ideas), true);
  } catch(e) { console.error('Save failed', e); }
}

function escHtml(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function initials(name) {
  return name.split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0,2);
}

function render() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = ideas;

  if (activeFilter !== 'all') filtered = filtered.filter(i => i.cat === activeFilter);
  if (search) filtered = filtered.filter(i =>
    i.title.toLowerCase().includes(search) ||
    (i.type     || '').toLowerCase().includes(search) ||
    (i.desc     || '').toLowerCase().includes(search) ||
    (i.name     || '').toLowerCase().includes(search) ||
    (i.assigned || '').toLowerCase().includes(search)
  );

  document.getElementById('countEl').textContent = ideas.length;
  const container = document.getElementById('cardContainer');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-hex">💡</div>
        <p>${ideas.length === 0
          ? 'No ideas yet — be the first to add one above!'
          : 'No ideas match your current filter.'}</p>
      </div>`;
    return;
  }

  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'cards-grid';

  filtered.slice().reverse().forEach((idea, i) => {
    const cat = CATS[idea.cat] || CATS.aki;
    const card = document.createElement('div');
    card.className = 'idea-card';
    card.style.setProperty('--accent', cat.color);
    card.style.animationDelay = `${Math.min(i, 8) * 0.05}s`;

    const date = idea.ts
      ? new Date(idea.ts).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })
      : '';

    const hasDetail = idea.desc || idea.assigned || idea.type;

    // Build assigned pill HTML
    let assignedHtml = '';
    if (idea.assigned) {
      const people = idea.assigned.split(/[,;]+/).map(s => s.trim()).filter(Boolean);
      assignedHtml = people.map(p =>
        `<span class="assigned-pill"><span class="assigned-avatar">${escHtml(initials(p))}</span>${escHtml(p)}</span>`
      ).join(' ');
    }

    card.innerHTML = `
      <div class="card-cat" style="color:${cat.color}">${cat.emoji} ${cat.label}</div>
      <div class="card-title">${escHtml(idea.title)}</div>
      ${idea.type ? `<div class="card-type">📋 ${escHtml(idea.type)}</div>` : ''}
      ${idea.assigned ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;">${assignedHtml}</div>` : ''}

      <div class="card-detail">
        ${idea.desc ? `
          <div class="detail-row">
            <span class="detail-label">Description</span>
            <span class="detail-val">${escHtml(idea.desc)}</span>
          </div>` : ''}
        ${idea.assigned ? `
          <div class="detail-row">
            <span class="detail-label">Assigned to</span>
            <span class="detail-val">${escHtml(idea.assigned)}</span>
          </div>` : ''}
        ${idea.name ? `
          <div class="detail-row">
            <span class="detail-label">Added by</span>
            <span class="detail-val">${escHtml(idea.name)}</span>
          </div>` : ''}
      </div>

      <div class="card-footer">
        <span class="card-time">${idea.name ? escHtml(idea.name) + ' · ' : ''}${date}</span>
        ${hasDetail ? `<span class="toggle-hint" style="color:${cat.color}">tap to expand</span>` : ''}
      </div>
    `;

    if (hasDetail) {
      card.addEventListener('click', () => {
        const wasOpen = card.classList.contains('expanded');
        document.querySelectorAll('.idea-card.expanded').forEach(c => {
          c.classList.remove('expanded');
          const h = c.querySelector('.toggle-hint');
          if (h) h.textContent = 'tap to expand';
        });
        if (!wasOpen) {
          card.classList.add('expanded');
          const h = card.querySelector('.toggle-hint');
          if (h) h.textContent = 'tap to close ↑';
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }

    grid.appendChild(card);
  });

  container.appendChild(grid);
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const title    = document.getElementById('inTitle').value.trim();
  const cat      = document.getElementById('inCat').value;
  const type     = document.getElementById('inType').value.trim();
  const desc     = document.getElementById('inDesc').value.trim();
  const name     = document.getElementById('inName').value.trim();
  const assigned = document.getElementById('inAssigned').value.trim();
  const msg      = document.getElementById('formMsg');

  if (!title) {
    msg.style.color = '#ff6b6b';
    msg.textContent = 'Please enter a research question or title.';
    document.getElementById('inTitle').focus();
    return;
  }

  ideas.push({ id: Date.now(), cat, title, type, desc, name, assigned, ts: Date.now() });
  await saveIdeas();

  ['inTitle','inType','inDesc','inAssigned'].forEach(id => document.getElementById(id).value = '');

  msg.style.color = 'var(--teal-soft)';
  msg.textContent = '✓ Idea added successfully!';
  setTimeout(() => { msg.textContent = ''; }, 3000);

  document.querySelectorAll('.filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === 'all'));
  activeFilter = 'all';

  render();
});

document.getElementById('filterBar').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.filter;
  render();
});

document.getElementById('searchInput').addEventListener('input', render);

loadIdeas();
</script>
</body>
</html>
